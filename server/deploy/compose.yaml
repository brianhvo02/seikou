# The generic compose file: every value of yours lives in .env next to it (copy .env.example). Start it with
#   docker compose up -d
# With a GPU (/dev/dri/renderD128) a manual restart must include the override, or the quality levels lose it:
#   docker compose -f compose.yaml -f compose.gpu.yaml up -d
# More library mounts go in a compose.override.yaml beside this file (Compose merges it automatically); see the
# volumes comment below.
services:
  bluray-server:
    image: ${BLURAY_IMAGE:-ghcr.io/brianhvo02/bluray-server:latest}
    container_name: bluray-server
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      PORT: "8080"
    # Every setting (LIBRARY_ROOTS, PUBLIC_BASE, APP_URL, RENDEZVOUS_URL, RTC_LAN_ADDRESS, TRUSTED_PROXY, TZ,
    # TITLE_LIBRARY, LEVELS_BACKEND, the optional keys) comes from .env, which is documented in .env.example.
    # The server refuses to start without PUBLIC_BASE, and so does every subcommand (owner-code, nas-id).
    env_file:
      - path: .env
        required: false
    # LIBRARY_MOUNT (a host folder) is bound read-only at /library, and LIBRARY_ROOTS names folders under it.
    # create_host_path: false means Docker never makes a missing folder (an unmounted drive stays missing, it is not
    # replaced by an empty one on the root filesystem). rslave lets a drive mounted under that folder after the
    # container started (a late nofail mount) appear inside it. A root whose folder is missing or empty keeps the
    # discs of its last scan. Mounts are always read-only: the server never writes to your library.
    # For a second folder, add it in compose.override.yaml with the same bind options at its own target
    # (for example /library2) and name it in LIBRARY_ROOTS.
    volumes:
      - type: bind
        source: ${LIBRARY_MOUNT:-/srv/bluray}
        target: /library
        read_only: true
        bind: { create_host_path: false, propagation: rslave }
      - bluray-data:/data
    # The WebRTC route (needs RENDEZVOUS_URL): ICE uses only this UDP port, forward it to this host on your router.
    # The server advertises its public IPv4 (from STUN) and RTC_LAN_ADDRESS, never Docker's address. The port is
    # also the server's RTC_PORT; keep the two equal.
    ports:
      - "${RTC_PORT:-47998}:${RTC_PORT:-47998}/udp"
    # Quality levels (LEVELS_BACKEND=qsv): re-encoding on an Intel GPU through Quick Sync (Debian's ffmpeg in the
    # image). The render node comes from compose.gpu.yaml; without it, or when the self-test at start fails, only
    # Original is offered. Segments are cached in /data/transcode (50 GB by default).
    # To reach the server through a reverse proxy that runs in Docker, attach this service to the proxy's network in
    # compose.override.yaml (networks: with that network as external: true).

volumes:
  bluray-data:
