name: WASM

on:
  push:
    branches: [main]
    paths: ['src/wasm/**', 'packages/engine/wasm/**']
  pull_request:
    paths: ['src/wasm/**', 'packages/engine/wasm/**']

jobs:
  reproducible:
    name: ${{ matrix.module }}.wasm matches its source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: audio
            dir: packages/engine/wasm/audio
          - module: freetype
            dir: src/wasm/freetype
    steps:
      - uses: actions/checkout@v4
      - run: ${{ matrix.dir }}/build.sh
      - run: git diff --exit-code ${{ matrix.dir }}/
