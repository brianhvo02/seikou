name: CI

on:
  push:
    # beta deploys the site to https://beta.bluray.pages.dev (the Pages project's `beta` branch alias); the Worker and the
    # server image come from main only
    branches: [main, beta]
  pull_request:
  # Every job, weekly and by hand, for whatever the path groups in scripts/ci-changes.sh miss. A manual run on main
  # deploys too.
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

# The event is in the group, so the weekly run never cancels a push's run on main (or the other way round).
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Which jobs this change needs. A push compares with the last push to its branch whose run succeeded (none yet: every
  # job), so the changes of a cancelled or failed run are tested (and deployed) by the next one; a pull request compares
  # with its base branch.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      unit: ${{ steps.groups.outputs.unit }}
      e2e: ${{ steps.groups.outputs.e2e }}
      ass: ${{ steps.groups.outputs.ass }}
      site: ${{ steps.groups.outputs.site }}
      worker: ${{ steps.groups.outputs.worker }}
      image: ${{ steps.groups.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          # the whole history without file contents: enough for git diff --name-only against any earlier commit
          fetch-depth: 0
          filter: blob:none
      - id: groups
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${{ github.event_name }}" in
            pull_request) base="$(git rev-parse HEAD^1)" ;;
            push) base="$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=${{ github.ref_name }}&event=push&status=success&per_page=1" \
                    --jq '.workflow_runs[0].head_sha // empty')" ;;
            *) base='' ;;
          esac
          scripts/ci-changes.sh "$base" >> "$GITHUB_OUTPUT"

  check:
    name: Typecheck and unit tests
    needs: changes
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@11.19.0 # allowScripts in package.json needs npm 11.19
      - run: npm ci
      # The NAS encoder's tests run ffmpeg with libx264 (server/src/levels/encoder.test.ts).
      - uses: ./.github/actions/setup-ffmpeg
      - run: npm run typecheck
      - run: npm test

  # One runner per browser project: sharing one 4-vCPU runner with the other browsers starved WebKit (software-rendered,
  # no GPU), whose playback clock and page then fell seconds behind the tests' waits.
  e2e:
    name: Browser tests (${{ matrix.project }})
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    # The installs can be slow when the Ubuntu mirror is; the tests themselves have their own limit below.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, browser: chrome }
          - { project: firefox, browser: firefox }
          - { project: webkit, browser: webkit }
          - { project: mobile-chromium, browser: chrome }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@11.19.0
      - run: npm ci
      # The NAS stand-in encodes quality levels with ffmpeg and libx264 (bdj-store.spec.ts starts it on mobile-chromium too).
      - uses: ./.github/actions/setup-ffmpeg
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: scripts/ci-audio.sh
      - run: npm run test:e2e -- --project ${{ matrix.project }}
        timeout-minutes: 20
        env:
          # Linux containers measured up to 19 ms mean / 41 ms max offset against the 20/50 ms bounds; 1.5 gives headroom.
          SYNC_TOLERANCE_SCALE: '1.5'
          # the runners (likely drawing canvases without a GPU) put 26-29% of the animated sign's draws over 8 ms against the spec's 5%; 8 allows 40%
          ASS_BUDGET_SCALE: '8'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-${{ matrix.project }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # the native ASS renderer against the libass goldens (layout traces and frames)
  ass:
    name: ASS renderer vs libass (Chrome)
    needs: changes
    if: needs.changes.outputs.ass == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@11.19.0
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npm run test:ass
        timeout-minutes: 20
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ass-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # The pairing-code rendezvous Worker (rendezvous/wrangler.toml). Its own job, so a failure here never blocks the Pages deploy.
  deploy-rendezvous:
    name: Deploy the rendezvous Worker
    needs: [changes, check, e2e, ass]
    # a skipped test job (nothing of its own changed) doesn't hold a deploy back; a failed or cancelled one does
    if: >-
      !cancelled() && !failure() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-rendezvous
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@11.19.0
      - run: npm ci
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler 4 (Node >= 22) deploys SQLite-backed Durable Objects (`new_sqlite_classes`); pinned, not the action's 3.x default
          wranglerVersion: '4.148.0'
          workingDirectory: rendezvous
          command: deploy

  deploy:
    name: Deploy to Cloudflare Pages
    needs: [changes, check, e2e, ass]
    # a skipped test job (nothing of its own changed) doesn't hold a deploy back; a failed or cancelled one does
    if: >-
      !cancelled() && !failure() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    # a newer push to the branch must not cancel an upload halfway; deploys queue instead
    concurrency:
      group: deploy-pages-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@11.19.0
      - run: npm ci
      - run: npm run build
        env:
          # the Worker's workers.dev URL, a repository variable set after its first deploy; unset, pairing by code reports the service unavailable
          VITE_RENDEZVOUS_URL: ${{ vars.RENDEZVOUS_URL }}
      # dist/_headers carries COOP/COEP; without them SharedArrayBuffer is unavailable
      - run: test -f dist/_headers
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler-action's default (3.90.0) conflicts with @cloudflare/workers-types 5 in package.json
          wranglerVersion: '4.148.0'
          # main is the production site, bluray.pages.dev; beta is the branch alias beta.bluray.pages.dev
          command: pages deploy dist --project-name=bluray --branch=${{ github.ref_name }}

  # The NAS server image, for people who self-host it (docs/self-hosting.md). The package is made public once in GitHub's
  # package settings. Its own job, so a failure here never blocks the site deploys.
  publish-server-image:
    name: Publish the server image
    needs: [changes, check, e2e, ass]
    # a skipped test job (nothing of its own changed) doesn't hold a deploy back; a failed or cancelled one does
    if: >-
      !cancelled() && !failure() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-server-image
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@11.19.0
      - run: npm ci
      - run: npm run server:build
      - id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/brianhvo02/bluray-server:latest
            ghcr.io/brianhvo02/bluray-server:${{ steps.sha.outputs.short }}
          # Links the package to this repository on GitHub (its page, README and source).
          labels: |
            org.opencontainers.image.source=https://github.com/brianhvo02/seikou
