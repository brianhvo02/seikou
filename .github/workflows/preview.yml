name: Preview deploy

# manual only: deploys the branch the run was started on as a Cloudflare Pages preview.
# main is refused here; production deploys stay in ci.yml, gated on the tests.
on:
  workflow_dispatch:

# one preview run per branch; a newer dispatch supersedes the one still running
concurrency:
  group: preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy preview to Cloudflare Pages
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # the branch name goes into a shell command and a Pages branch flag, so accept only plain names
      - name: Validate branch name
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          [[ "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::unsupported branch name: $BRANCH"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@11.19.0 # allowScripts in package.json needs npm 11.19
      - run: npm ci
      - run: npm run build
        env:
          # the rendezvous Worker, as in ci.yml; without it pairing by code reports the service unavailable
          VITE_RENDEZVOUS_URL: ${{ vars.RENDEZVOUS_URL }}
      # dist/_headers carries COOP/COEP; without them SharedArrayBuffer is unavailable
      - run: test -f dist/_headers
      - uses: cloudflare/wrangler-action@v3
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler-action's default (3.90.0) conflicts with @cloudflare/workers-types 5 in package.json
          wranglerVersion: '4.148.0'
          command: pages deploy dist --project-name=bluray --branch=${{ github.ref_name }}
      - name: Job summary
        env:
          BRANCH: ${{ github.ref_name }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          {
            echo "### Preview deployed"
            echo ""
            echo "Branch: \`$BRANCH\`"
            echo ""
            echo "- Alias: ${ALIAS_URL:-not reported}"
            echo "- Deployment: ${DEPLOYMENT_URL:-not reported}"
          } >> "$GITHUB_STEP_SUMMARY"
